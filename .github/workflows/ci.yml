name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-hygiene.sh

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in the PR carries a DCO sign-off
        run: |
          set -euo pipefail
          missing=0
          # Merge commits (e.g. GitHub "Update branch") carry no authored change and are
          # discarded by squash merge, so only non-merge commits need a sign-off.
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: .* <.*>'; then
              echo "::error::missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "DCO: all commits signed off"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip pytest
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install --quiet -e .; fi
      - name: Test
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || ls tests/*.py >/dev/null 2>&1; then
            python -m pytest -q
          else
            echo "no tests yet"
          fi
